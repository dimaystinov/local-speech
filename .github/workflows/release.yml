name: SDK release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/mac
  release:
    needs: swift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run prepare && npm run release:check
      - run: npm pack --ignore-scripts
      - run: sha256sum local-speech-sdk-*.tgz > SHA256SUMS
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json')).version;
            const tag = `v${version}`;
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `LocalSpeech SDK ${tag}`,
              body: fs.readFileSync('CHANGELOG.md', 'utf8'), draft: true
            });
            for (const name of [`local-speech-sdk-${version}.tgz`, 'SHA256SUMS']) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data: fs.readFileSync(name)
              });
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false});
