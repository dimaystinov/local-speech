name: SDK tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: python3 -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python3 -m pip install numpy==2.2.6
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  tauri-example:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.93 --profile minimal
      - run: npm run prepare
      - run: npm ci && npm run assets && npm run build
        working-directory: examples/tauri
      - run: rustup run 1.93 cargo check --locked --manifest-path examples/tauri/src-tauri/Cargo.toml
